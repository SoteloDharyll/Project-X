name: Build and publish Arsenal assets

on:
  push:
    branches: [main]
    paths:
      - "arsenal/**"
      - ".github/workflows/arsenal-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arsenal-build-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Vite source entry
        run: cp arsenal/index.source.html arsenal/index.html

      - name: Install dependencies
        working-directory: arsenal
        run: npm install

      - name: Generate installable PNG icons
        working-directory: arsenal
        run: |
          npm install --no-save sharp
          node --input-type=module -e "import sharp from 'sharp'; await sharp('icon.svg').resize(192,192).png().toFile('icon-192.png'); await sharp('icon.svg').resize(512,512).png().toFile('icon-512.png');"

      - name: Build production app
        working-directory: arsenal
        run: npm run build

      - name: Publish compiled production output
        run: |
          rm -rf arsenal/assets
          cp -R arsenal/dist/. arsenal/
          rm -rf arsenal/dist
          test -f arsenal/index.html
          grep -q 'assets/index-' arsenal/index.html
          test -d arsenal/assets
          test -f arsenal/manifest.webmanifest
          test -f arsenal/sw.js
          test -f arsenal/icon.svg
          test -f arsenal/icon-192.png
          test -f arsenal/icon-512.png

      - name: Commit compiled files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arsenal/index.html arsenal/assets arsenal/manifest.webmanifest arsenal/sw.js arsenal/icon.svg arsenal/icon-192.png arsenal/icon-512.png
          if git diff --cached --quiet; then
            echo "No compiled changes."
            exit 0
          fi
          git commit -m "Build and publish Arsenal PWA [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
