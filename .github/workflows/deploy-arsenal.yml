name: Deploy Arsenal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "arsenal/**"
      - ".github/workflows/deploy-arsenal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: arsenal
        run: npm install

      - name: Build Arsenal
        working-directory: arsenal
        run: npm run build

      - name: Preserve Project-X site and add Arsenal
        run: |
          mkdir -p _site/arsenal
          rsync -a --exclude='.git' --exclude='.github' --exclude='arsenal' --exclude='node_modules' ./ _site/
          cp -R arsenal/dist/. _site/arsenal/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
