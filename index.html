<title>Project X — Master the Mind, Master the Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1410;
    --bg-raised: #131A15;
    --bg-card: #161E18;
    --hairline: #25312A;
    --hairline-bright: #34453B;
    --text-primary: #E8EEE9;
    --text-secondary: #8FA399;
    --text-dim: #5C6B63;
    --green: #4ADE80;
    --green-dim: #1F3A2A;
    --gold: #D4AF37;
    --gold-dim: #3A3014;
    --amber: #F5A623;
    --amber-dim: #3A2E14;
    --red: #E5484D;
    --red-dim: #3A1A1B;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  body {
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  a, button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(14,20,16,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
  }
  .topbar-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .brand-logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
    line-height: 1.2;
  }
  .brand-sub {
    display: block;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .brand b { color: var(--text-secondary); }
  .session-status {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 3px;
    border: 1px solid var(--hairline-bright);
    color: var(--text-dim);
  }
  .session-status.live { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }

  .progress-track {
    margin-top: 12px;
    height: 3px;
    background: var(--hairline);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), #6EE7A0);
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Bias selector ---------- */
  .bias-bar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .bias-btn {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border-radius: 6px;
    border: 1px solid var(--hairline-bright);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  .bias-btn.active.buy { background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .bias-btn.active.sell { background: var(--red-dim); color: var(--red); border-color: var(--red); }

  /* ---------- Main funnel ---------- */
  .funnel {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 8px;
    position: relative;
  }

  .stage {
    position: relative;
    border: 1px solid var(--hairline);
    background: var(--bg-card);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.25s ease;
  }
  .stage.locked { opacity: 0.45; }
  .stage.active { border-color: var(--hairline-bright); }
  .stage.passed { border-color: var(--green-dim); }
  .stage.violated { border-color: var(--red); animation: shake 0.32s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .stage-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .stage-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--hairline-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .stage.passed .stage-num { background: var(--green); border-color: var(--green); color: #0E1410; }
  .stage.active .stage-num { border-color: var(--amber); color: var(--amber); }

  .stage-title-wrap { flex: 1; min-width: 0; }
  .stage-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .stage.locked .stage-title { color: var(--text-dim); }
  .stage-sub {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-top: 1px;
  }
  .stage-chevron {
    color: var(--text-dim);
    font-size: 12px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .stage.open .stage-chevron { transform: rotate(180deg); }

  .stage-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .stage.open .stage-body { max-height: 800px; }
  .stage-body-inner { padding: 0 16px 16px; }

  .rule-text {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: 12px;
  }
  .rule-text strong { color: var(--text-primary); }

  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--hairline);
    cursor: pointer;
  }
  .check-row:first-of-type { border-top: none; }
  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--hairline-bright);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: transparent;
    transition: all 0.15s ease;
  }
  .check-box.checked { background: var(--green); border-color: var(--green); color: #0E1410; }
  .check-label { font-size: 13.5px; color: var(--text-primary); line-height: 1.4; }
  .check-label small { display: block; color: var(--text-dim); font-size: 11.5px; margin-top: 2px; }

  .or-divider {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin: 2px 0;
  }

  .forbidden-callout {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 7px;
    background: var(--red-dim);
    border: 1px solid rgba(229,72,77,0.35);
    font-size: 12px;
    color: #F2A6A9;
    line-height: 1.5;
  }
  .forbidden-callout b { color: var(--red); }

  .stage-action {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border-radius: 7px;
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .stage-action.ready { background: var(--green); color: #0E1410; }
  .stage-action.notready { background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--hairline-bright); cursor: not-allowed; }

  /* ---------- TP option toggle ---------- */
  .tp-options { display: flex; gap: 8px; margin-bottom: 12px; }
  .tp-opt {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    border-radius: 6px;
    border: 1px solid var(--hairline-bright);
    background: var(--bg-raised);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
  }
  .tp-opt.active { background: var(--green-dim); color: var(--green); border-color: var(--green); }

  /* ---------- Final verdict ---------- */
  .verdict {
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin-top: 6px;
    border: 1px solid var(--hairline);
    background: var(--bg-card);
  }
  .verdict.go { border-color: var(--green); background: var(--green-dim); }
  .verdict.no { border-color: var(--hairline-bright); }
  .verdict-icon { font-size: 28px; margin-bottom: 6px; }
  .verdict-title { font-family: var(--mono); font-size: 15px; letter-spacing: 0.08em; }
  .verdict.go .verdict-title { color: var(--green); }
  .verdict-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }

  .reset-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---------- Golden rule footer ---------- */
  .golden-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: rgba(14,20,16,0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline);
    padding: 12px 20px calc(env(safe-area-inset-bottom) + 12px);
    text-align: center;
  }
  .golden-bar p {
    margin: 0;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
  }
  .golden-bar p::before { content: '▸ '; color: var(--amber); }

  /* ---------- Log ---------- */
  .log-section {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 140px;
  }
  .log-toggle {
    text-align: center;
    margin-top: 18px;
  }
  .log-toggle button {
    background: none;
    border: 1px solid var(--hairline-bright);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .log-entries { margin-top: 10px; display: none; }
  .log-entries.open { display: block; }
  .log-entry {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 10px 10px 10px 12px;
    font-size: 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--text-secondary);
  }
  .log-entry-main {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .log-entry .tag { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .log-entry .tag.go { background: var(--green-dim); color: var(--green); }
  .log-entry .tag.no { background: var(--red-dim); color: var(--red); }
  .log-entry-del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 5px;
  }
  .log-entry-del:hover { color: var(--red); background: var(--red-dim); }
  .log-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 14px 0;
  }
  .log-clear {
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: underline;
    background: none;
    border: none;
    cursor: pointer;
    display: block;
    margin: 10px auto 0;
  }
  .log-clear:disabled { opacity: 0.4; text-decoration: none; cursor: default; }
</style>
</head>

    or: true,
    checksOr: [
      { id: 'm15c_reject', label: 'M15 candle rejects the EG' },
    ],
    forbidden: 'Going to M5 without M15 confirmation.'
  },
  {
    key: 'm5entry',
    title: '6 · M5 Entry Rule',
    sub: 'TRIGGER',
    rule: 'Wait for an M5 Engulfing in the trade direction. Enter immediately after that M5 candle closes — never before.',
    checks: [
      { id: 'm5_eg', label: 'M5 EG formed in trade direction' },
      { id: 'm5_closed', label: 'The M5 EG candle has fully closed' },
    ],
    forbidden: 'Entering before the candle closes, or entering without an M5 EG.'
  },
  {
    key: 'risk',
    title: '7 · Stop Loss & Take Profit',
    sub: 'SL / TP',
    rule: 'Buy: SL below the M5 swing low. Sell: SL above the M5 swing high. Then choose one TP method below.',
    checks: [
      { id: 'sl_set', label: 'SL placed correctly per bias (below swing low / above swing high)' },
    ],
    tp: true,
    forbidden: 'Moving SL farther away. Random TP adjustments.'
  },
];

const STORAGE_KEY = 'xsetup_corea_state_v1';
const LOG_KEY = 'xsetup_corea_log_v1';

let state = loadState();

function defaultState() {
  return { bias: null, openStage: 0, checks: {}, tp: null };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) { return defaultState(); }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch(e) { return []; }
}
function saveLog(log) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch(e) {}
}

function logTrade(result) {
  const log = loadLog();
  log.unshift({
    id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    ts: new Date().toISOString(),
    bias: state.bias,
    result: result,
    tp: state.tp
  });
  saveLog(log.slice(0, 200));
  renderLog();
}

/* ---------------- Gate logic ---------------- */
function stagePassed(stage) {
  const allOk = stage.checks.every(c => state.checks[c.id]);
  if (stage.tp && !state.tp) return false;
  if (!stage.or) return allOk;
  // OR-type stage: main checks already required, OR alt checks satisfy alternative
  const mainOk = stage.checks.every(c => state.checks[c.id]);
  const altOk = stage.checksOr.every(c => state.checks[c.id]);
  return mainOk || altOk;
}

function furthestUnlockedIndex() {
  // index of the first stage NOT yet passed -> that's the active one (and only one allowed to be open/interacted)
  for (let i = 0; i < STAGES.length; i++) {
    if (!stagePassed(STAGES[i])) return i;
  }
  return STAGES.length; // all passed
}

function setBias(b) {
  // changing bias after progress invalidates downstream — reset checks to keep integrity
  if (state.bias !== b) {
    state.bias = b;
    state.checks = {};
    state.tp = null;
    state.openStage = 0;
    saveState();
    render();
  }
}

function toggleCheck(id, stageIdx) {
  const active = furthestUnlockedIndex();
  if (stageIdx > active) {
    flashViolation(stageIdx);
    return;
  }
  if (!state.bias) {
    flashViolation(stageIdx);
    return;
  }
  state.checks[id] = !state.checks[id];
  saveState();
  // if this stage just became passed and it was the active one, auto-advance the open panel to the next gate
  const newActive = furthestUnlockedIndex();
  if (newActive > active && state.openStage === active) {
    state.openStage = newActive;
  }
  saveState();
  render();
}

function setTp(val) {
  const active = furthestUnlockedIndex();
  if (active !== STAGES.length - 1) return;
  state.tp = val;
  saveState();
  render();
}

let violationTimeout = null;
function flashViolation(idx) {
  const el = document.querySelector(`.stage[data-idx="${idx}"]`);
  if (!el) return;
  el.classList.add('violated');
  clearTimeout(violationTimeout);
  violationTimeout = setTimeout(() => el.classList.remove('violated'), 350);
}

function toggleOpen(idx) {
  state.openStage = state.openStage === idx ? -1 : idx;
  saveState();
  render();
}

function resetAll() {
  if (!confirm('Reset the checklist for a new setup? This clears all checks.')) return;
  state = defaultState();
  saveState();
  render();
}

function noTrade() {
  logTrade('no');
  resetSilently();
}
function resetSilently() {
  state = defaultState();
  saveState();
  render();
}

/* ---------------- Render ---------------- */
function render() {
  const activeIdx = furthestUnlockedIndex();
  const allPassed = activeIdx === STAGES.length;

  // top status
  const statusEl = document.getElementById('sessionStatus');
  statusEl.textContent = allPassed ? 'TAKE THE TRADE' : (state.bias ? `GATE ${activeIdx+1}/7` : 'SET BIAS');
  statusEl.classList.toggle('live', allPassed);

  // progress bar
  const pct = Math.round((activeIdx / STAGES.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  // bias buttons
  document.getElementById('biasBuy').classList.toggle('active', state.bias === 'buy');
  document.getElementById('biasSell').classList.toggle('active', state.bias === 'sell');

  const funnel = document.getElementById('funnel');
  funnel.innerHTML = '';

  STAGES.forEach((stage, idx) => {
    const passed = stagePassed(stage);
    const locked = idx > activeIdx;
    const isActive = idx === activeIdx && !allPassed;
    const isOpen = state.openStage === idx;

    const div = document.createElement('div');
    div.className = `stage ${locked ? 'locked' : ''} ${isActive ? 'active' : ''} ${passed ? 'passed' : ''} ${isOpen ? 'open' : ''}`;
    div.dataset.idx = idx;

    const head = document.createElement('div');
    head.className = 'stage-head';
    head.onclick = () => { if (!locked) toggleOpen(idx); else flashViolation(idx); };
    head.innerHTML = `
      <div class="stage-num">${passed ? '✓' : idx+1}</div>
      <div class="stage-title-wrap">
        <div class="stage-title">${stage.title}</div>
        <div class="stage-sub">${stage.sub}</div>
      </div>
      <div class="stage-chevron">▾</div>
    `;
    div.appendChild(head);

    const body = document.createElement('div');
    body.className = 'stage-body';
    const inner = document.createElement('div');
    inner.className = 'stage-body-inner';
    inner.innerHTML = `<div class="rule-text">${stage.rule}</div>`;

    stage.checks.forEach(c => {
      const row = document.createElement('div');
      row.className = 'check-row';
      row.onclick = (e) => { e.stopPropagation(); toggleCheck(c.id, idx); };
      const checked = !!state.checks[c.id];
      row.innerHTML = `
        <div class="check-box ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
        <div class="check-label">${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}</div>
      `;
      inner.appendChild(row);
    });

    if (stage.or) {
      const orDiv = document.createElement('div');
      orDiv.className = 'or-divider';
      orDiv.textContent = 'OR';
      inner.appendChild(orDiv);
      stage.checksOr.forEach(c => {
        const row = document.createElement('div');
        row.className = 'check-row';
        row.onclick = (e) => { e.stopPropagation(); toggleCheck(c.id, idx); };
        const checked = !!state.checks[c.id];
        row.innerHTML = `
          <div class="check-box ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
          <div class="check-label">${c.label}</div>
        `;
        inner.appendChild(row);
      });
    }

    if (stage.tp) {
      const tpWrap = document.createElement('div');
      tpWrap.className = 'tp-options';
      tpWrap.innerHTML = `
        <div class="tp-opt ${state.tp === 'rr3' ? 'active' : ''}" data-tp="rr3">Fixed 1:3 RR</div>
        <div class="tp-opt ${state.tp === 'opposing' ? 'active' : ''}" data-tp="opposing">Opposing H1 EG/EF</div>
      `;
      tpWrap.querySelectorAll('.tp-opt').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); setTp(el.dataset.tp); };
      });
      inner.appendChild(tpWrap);
    }

    const forbidden = document.createElement('div');
    forbidden.className = 'forbidden-callout';
    forbidden.innerHTML = `<b>FORBIDDEN</b> — ${stage.forbidden}`;
    inner.appendChild(forbidden);

    body.appendChild(inner);
    div.appendChild(body);
    funnel.appendChild(div);
  });

  // Verdict block
  const verdict = document.createElement('div');
  if (allPassed) {
    verdict.className = 'verdict go';
    verdict.innerHTML = `
      <div class="verdict-icon">✅</div>
      <div class="verdict-title">TAKE THE TRADE</div>
      <div class="verdict-sub">All 7 gates checked. Bias: ${state.bias === 'buy' ? 'BUY' : 'SELL'} · TP: ${state.tp === 'rr3' ? 'Fixed 1:3' : 'Opposing H1 EG/EF'}</div>
      <button class="reset-btn" onclick="logAndReset('go')">Log this trade & start a new setup</button>
    `;
  } else if (state.bias) {
    verdict.className = 'verdict no';
    verdict.innerHTML = `
      <div class="verdict-icon">⛔</div>
      <div class="verdict-title" style="color: var(--text-dim)">NO TRADE — GATE ${activeIdx+1} OPEN</div>
      <div class="verdict-sub">Complete every box in Stage ${activeIdx+1} before continuing.</div>
      <button class="reset-btn" onclick="noTrade()">Abandon setup &amp; log as No Trade</button>
    `;
  }
  funnel.appendChild(verdict);
}

function logAndReset(result) {
  logTrade(result);
  resetSilently();
}

let logOpen = false;
function toggleLog() {
  logOpen = !logOpen;
  document.getElementById('logEntries').classList.toggle('open', logOpen);
  document.getElementById('logToggleBtn').textContent = logOpen ? 'HIDE TRADE LOG' : 'VIEW TRADE LOG';
}

function renderLog() {
  const log = loadLog();
  const el = document.getElementById('logEntries');
  if (!el) return;

  if (log.length === 0) {
    el.innerHTML = `<div class="log-empty">No trades logged yet.</div>`;
    return;
  }

  const rows = log.map((entry, i) => {
    const entryId = entry.id || ('legacy_' + i);
    const d = new Date(entry.ts);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const tag = entry.result === 'go' ? '<span class="tag go">TAKEN</span>' : '<span class="tag no">NO TRADE</span>';
    const biasLabel = entry.bias ? entry.bias.toUpperCase() : '—';
    return `
      <div class="log-entry" data-id="${entryId}">
        <div class="log-entry-main">
          <span>${dateStr} · ${biasLabel}</span>
          ${tag}
        </div>
        <button class="log-entry-del" onclick="deleteLogEntry('${entryId}')" aria-label="Delete entry" title="Delete entry">✕</button>
      </div>`;
  }).join('');

  el.innerHTML = rows + `<button class="log-clear" onclick="clearLog()">Clear all (${log.length})</button>`;
}

function deleteLogEntry(id) {
  let log = loadLog();
  if (id.startsWith('legacy_')) {
    const idx = parseInt(id.replace('legacy_', ''), 10);
    log.splice(idx, 1);
  } else {
    log = log.filter(e => e.id !== id);
  }
  saveLog(log);
  renderLog();
}

function clearLog() {
  if (!confirm('Clear the entire trade log? This cannot be undone.')) return;
  saveLog([]);
  renderLog();
}

render();
renderLog();
</script>
